<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0e12" />
    <!-- 資產層 not_found_handling = "404-page"：任何不存在的路徑都回這份，HTTP 狀態 404。 -->
    <meta name="robots" content="noindex" />
    <title>找不到這個頁面｜戰鬥陀螺</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0e12;
        --text: #dfe5ee;
        --muted: #9aa4b3;
        --steel: #aab4c4;
        --accent: #ffb31f;
        --lava: #ff7a18;
        --white-hot: #fff3d6;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: "Noto Sans TC", system-ui, sans-serif;
        line-height: 1.75;
        color: var(--text);
        background:
          radial-gradient(900px 480px at 50% -120px, rgba(255, 122, 24, 0.12), transparent 70%),
          var(--bg);
      }
      .hazard {
        height: 5px;
        background: repeating-linear-gradient(-45deg, var(--accent) 0 9px, #14161b 9px 18px);
        opacity: 0.85;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: 72px 16px 40px;
        text-align: center;
      }
      .code {
        margin: 0;
        font-weight: 900;
        font-size: 64px;
        line-height: 1;
        letter-spacing: 0.08em;
        background: linear-gradient(100deg, #ffe9c4 10%, var(--accent) 38%, var(--lava) 72%, #d8490e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 26px;
        letter-spacing: 0.06em;
        color: var(--white-hot);
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 10px 20px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-decoration: none;
        color: var(--text);
        background: linear-gradient(180deg, #3c434f, #23272f 55%, #181b21);
        clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
      }
      .btn-primary {
        color: #1a0d02;
        background: linear-gradient(180deg, #ffc954, var(--accent) 40%, var(--lava) 88%, #c9540c);
      }
      .btn:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      footer {
        padding: 22px 16px 36px;
        text-align: center;
        font-size: 14px;
      }
      footer ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 22px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      footer a {
        color: var(--steel);
      }
      footer a:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="hazard" aria-hidden="true"></div>
    <main>
      <p class="code">404</p>
      <h1>找不到這個頁面</h1>
      <p>網址可能打錯了，或這個頁面已經不存在。</p>
      <p>要找朋友對戰，請回首頁登入後輸入對方給你的房號。</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">回戰鬥陀螺首頁</a>
        <a class="btn" href="https://www.pocketool.app/">逛逛口袋工具</a>
      </div>
    </main>
    <footer>
      <ul>
        <li><a href="https://www.pocketool.app/privacy">隱私權政策</a></li>
        <li><a href="https://www.pocketool.app/terms">服務條款</a></li>
        <li><a href="https://www.pocketool.app/contact">聯絡</a></li>
        <li><a href="https://www.pocketool.app/">口袋工具</a></li>
      </ul>
    </footer>
  </body>
</html>
